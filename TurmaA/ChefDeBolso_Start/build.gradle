// Arquivo de build da raiz: só declara os plugins, quem aplica é o módulo app.
plugins {
    id 'com.android.application' version '9.0.1' apply false
    // Lê o google-services.json e configura o Firebase (mesmo plugin da semana 9)
    id 'com.google.gms.google-services' version '4.5.0' apply false
}
